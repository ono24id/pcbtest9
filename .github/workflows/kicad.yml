# One workflow for everything, one run per push:
#   Rename project  - only on the first push of a repository generated from the template:
#                     renames PROJECT_NAME to the repository name and commits it.
#   Build           - ERC, DRC and fabrication outputs with kicad-cli.
#   Release         - on a v* tag: attaches the outputs to a GitHub Release.
# The project is discovered automatically (sources/*/*.kicad_pro), nothing is hard-coded.
name: KiCad

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && 'Manual run' ||
    github.ref_type == 'tag' && format('Release {0}', github.ref_name) ||
    github.event_name == 'pull_request' && format('Build PR #{0}: {1}', github.event.number, github.event.pull_request.title) ||
    github.event.created && !github.event.repository.is_template && github.ref_name == github.event.repository.default_branch
      && format('Updating the project name to {0}, then checking the build', github.event.repository.name) ||
    format('Build: {0}', github.event.head_commit.message)
  }}

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", ".mcp.json", ".vscode/**", ".cursor/**", "scripts/mcp-kicad.sh"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    name: Rename project
    # First push of a new repository (or a manual run), never in the template itself.
    if: >-
      !github.event.repository.is_template &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      # The template repository may not be flagged as a template yet on its own first push,
      # so also require that this repository was generated from a template.
      - name: Check whether the project still has the template name
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d sources/PROJECT_NAME ]; then
            echo "Project already renamed, nothing to do."
            exit 0
          fi
          tpl="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.template_repository.full_name // empty')"
          if [ -z "$tpl" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Not generated from a template (this is the template repository), nothing to do."
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Rename PROJECT_NAME to ${{ github.event.repository.name }}
        if: steps.check.outputs.needed == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: bash scripts/init.sh "$REPO_NAME"

      - name: Commit and push
        id: commit
        if: steps.check.outputs.needed == 'true'
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename project to ${REPO_NAME}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: rename
    # Runs after Rename project, or on its own when that job is skipped.
    if: ${{ !cancelled() && needs.rename.result != 'failure' }}
    runs-on: ubuntu-latest
    # Use kicad/kicad:10.0-full if you need KiCad's 3D models in the STEP export (much larger image).
    container:
      image: kicad/kicad:10.0
      options: --user root
    env:
      HOME: /root
    outputs:
      name: ${{ steps.locate.outputs.name }}
      rev: ${{ steps.locate.outputs.rev }}
    steps:
      - name: Install git and zip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git zip ca-certificates >/dev/null

      - uses: actions/checkout@v7
        with:
          # Build the renamed commit if Rename project just pushed one.
          ref: ${{ needs.rename.outputs.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          # Private library submodules: add a SUBMODULE_TOKEN secret (PAT with read access).
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - name: Locate project
        id: locate
        run: |
          PRO="$(find sources -mindepth 2 -maxdepth 2 -name '*.kicad_pro' | head -n1)"
          [ -n "$PRO" ] || { echo "No .kicad_pro found under sources/"; exit 1; }
          NAME="$(basename "$PRO" .kicad_pro)"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then REV="${GITHUB_REF_NAME}"; else REV="$(git describe --tags --always --dirty)"; fi
          {
            echo "NAME=$NAME"
            echo "SCH=$(dirname "$PRO")/$NAME.kicad_sch"
            echo "PCB=$(dirname "$PRO")/$NAME.kicad_pcb"
            echo "REV=$REV"
            echo "OUT=output/$NAME-$REV"
          } >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "rev=$REV" >> "$GITHUB_OUTPUT"

      - name: ERC
        id: erc
        continue-on-error: true
        run: |
          mkdir -p "$OUT/reports"
          kicad-cli sch erc --severity-error --exit-code-violations \
            -o "$OUT/reports/erc.rpt" "$SCH"

      - name: DRC
        id: drc
        continue-on-error: true
        run: |
          kicad-cli pcb drc --severity-error --schematic-parity --exit-code-violations \
            -o "$OUT/reports/drc.rpt" "$PCB"

      - name: Schematic PDF and BOM
        run: |
          kicad-cli sch export pdf -D REVISION="$REV" -o "$OUT/$NAME-schematic.pdf" "$SCH"
          kicad-cli sch export bom -o "$OUT/$NAME-bom.csv" \
            --fields 'Reference,Value,Footprint,${QUANTITY}' \
            --labels 'Refs,Value,Footprint,Qty' \
            --group-by Value,Footprint --exclude-dnp "$SCH"

      - name: Gerbers, drill, placement
        run: |
          # Layer selection follows File > Plot settings saved in the board.
          kicad-cli pcb export gerbers --board-plot-params -D REVISION="$REV" -o "$OUT/gerbers/" "$PCB"
          kicad-cli pcb export drill --generate-map --map-format pdf -o "$OUT/gerbers/" "$PCB"
          kicad-cli pcb export pos --side both --format csv --units mm --exclude-dnp \
            -o "$OUT/$NAME-pos.csv" "$PCB"
          (cd "$OUT/gerbers" && zip -q -r "../$NAME-gerbers.zip" .)

      - name: PCB PDF and STEP
        run: |
          kicad-cli pcb export pdf --mode-multipage --ibt -D REVISION="$REV" \
            -l F.Cu,B.Cu,F.Silkscreen,B.Silkscreen,F.Fab,B.Fab --cl Edge.Cuts \
            -o "$OUT/$NAME-pcb.pdf" "$PCB"
          kicad-cli pcb export step -f --subst-models -o "$OUT/$NAME.step" "$PCB"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.NAME }}-${{ env.REV }}
          path: ${{ env.OUT }}

      - name: Fail on ERC/DRC violations
        if: steps.erc.outcome == 'failure' || steps.drc.outcome == 'failure'
        run: |
          cat "$OUT/reports/erc.rpt" "$OUT/reports/drc.rpt" 2>/dev/null || true
          echo "::error::ERC or DRC reported violations (see reports above / in the artifact)"
          exit 1

  release:
    name: Release
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.name }}-${{ needs.build.outputs.rev }}
          path: ${{ needs.build.outputs.name }}-${{ needs.build.outputs.rev }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
          REV: ${{ needs.build.outputs.rev }}
        run: |
          D="$NAME-$REV"
          zip -q -r "$D.zip" "$D"
          gh release create "$REV" --repo "$GITHUB_REPOSITORY" --title "$NAME $REV" --generate-notes \
            "$D.zip" "$D/$NAME-gerbers.zip" "$D/$NAME-schematic.pdf" "$D/$NAME-bom.csv" "$D/$NAME-pos.csv"
